server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: expense-service
              uri: ${EXPENSE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/expenses/**
            - id: stats-service
              uri: ${STATS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/stats/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
