<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Achievee</title>
  <style>
    :root { --bg: #0e0f11; --fg: #ececee; --fg2: #a0a2aa; --line: #2a2c31; --surface: #16171a; }
    @media (prefers-color-scheme: light) { :root { --bg: #f6f6f7; --fg: #17181a; --fg2: #5d5f68; --line: #e3e3e7; --surface: #fff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg);
      font: 400 15px/1.6 -apple-system, system-ui, "Pretendard Variable", Pretendard, sans-serif; }
    main { max-width: 360px; text-align: center; padding: 32px 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
    h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.02em; }
    p { margin: 0 0 6px; color: var(--fg2); }
    button { margin-top: 18px; height: 40px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>연결되면 다시 불러올 수 있어요.<br>기록은 안전하게 서버에 있어요.</p>
    <p lang="en">You're offline. Reconnect and try again.</p>
    <button onclick="location.reload()">다시 시도 · Retry</button>
  </main>
</body>
</html>
