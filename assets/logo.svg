<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Achievee calendar logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#3B2FD9"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A65"/>
      <stop offset="1" stop-color="#FF5C7A"/>
    </linearGradient>
  </defs>
  <!-- app icon background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- calendar body -->
  <rect x="96" y="120" width="320" height="300" rx="40" fill="#fff"/>
  <!-- header -->
  <path d="M96 160a40 40 0 0 1 40-40h240a40 40 0 0 1 40 40v50H96z" fill="url(#hdr)"/>
  <!-- binder rings -->
  <rect x="164" y="84" width="30" height="76" rx="15" fill="#fff"/>
  <rect x="318" y="84" width="30" height="76" rx="15" fill="#fff"/>
  <rect x="172" y="92" width="14" height="60" rx="7" fill="#3B2FD9"/>
  <rect x="326" y="92" width="14" height="60" rx="7" fill="#3B2FD9"/>
  <!-- date dots -->
  <g fill="#D9D6FF">
    <circle cx="154" cy="262" r="12"/><circle cx="210" cy="262" r="12"/>
    <circle cx="266" cy="262" r="12"/><circle cx="322" cy="262" r="12"/>
    <circle cx="378" cy="262" r="12"/>
    <circle cx="154" cy="388" r="12"/><circle cx="210" cy="388" r="12"/>
  </g>
  <!-- achievement check -->
  <circle cx="300" cy="350" r="52" fill="#22C55E"/>
  <path d="M274 351l20 20 38-42" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
