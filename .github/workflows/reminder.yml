name: Evening reminder
# Runs every hour; the endpoint itself decides who is at 21:xx local time and has not been reminded yet.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "CRON_SECRET is not set"; exit 1; }
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" https://www.achievee.space/api/cron/reminders
